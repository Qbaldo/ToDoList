{% extends "tasks/base.html" %}
{% block title %}Tags{% endblock %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Tags</h1>
    <a href="{% url 'tasks:tag-create' %}" class="btn btn-primary">
      Add tag
    </a>
  </div>
  {% if tags %}
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Update</th>
          <th>Delete</th>

        </tr>
      </thead>
      <tbody>
        {% for tag in tags %}
          <tr>
            <td>{{ tag.name }}</td>
            <td>
              <a href="{% url 'tasks:tag-update' tag.pk %}"
                 class="btn btn-sm btn-outline-primary">
                Update
              </a>
            </td>
            <td>
              <a href="{% url 'tasks:tag-delete' tag.pk %}"
                 class="btn btn-sm btn-outline-danger">
                Delete
              </a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No tags yet.</p>
  {% endif %}
{% endblock %}
