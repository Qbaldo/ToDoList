{% block content %}
  <h1 class="mb-4">Add Task</h1>

  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
      Save
    </button>

    <a href="{% url 'tasks:task-list' %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
