<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ToDo List{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="{% static 'tasks/css/style.css' %}">
</head>

<body>

<div class="container-fluid">
  <div class="row">
    <nav class="col-md-3 col-lg-2 d-md-block sidebar min-vh-100">
      <div class="position-sticky pt-3">
          <h4 class="px-3 mb-4">ToDo List</h4>
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link"
                 href="{% url 'tasks:task-list' %}">
                🏠 Home
              </a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                 href="{% url 'tasks:tag-list' %}">
                  🏷 Tags
                </a>
            </li>
          </ul>
        </div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        {% block content %}
        {% endblock %}
      </main>
  </div>
</div>

</body>
</html>
